name: Get Hot News

on:
  schedule:
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # ⚠️ 试用版说明 / Trial Mode
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    #
    # 🔄 运行机制 / How it works:
    #    - 每个周期为 7 天，届时自动停止
    #    - 运行 "Check In" 会重置周期（重新开始 7 天倒计时，而非累加）
    #    - Each cycle is 7 days, then auto-stops
    #    - "Check In" resets the cycle (restarts 7-day countdown, not cumulative)
    #
    # 💡 设计初衷 / Why this design:
    #    如果 7 天都忘了签到，或许这些资讯对你来说并非刚需
    #    适时的暂停，能帮你从信息流中抽离，给大脑留出喘息的空间
    #    If you forget for 7 days, maybe you don't really need it
    #    A timely pause helps you detach from the stream and gives your mind space
    #
    # 🙏 珍惜资源 / Respect shared resources:
    #    GitHub Actions 是平台提供的公共资源，每次运行都会消耗算力
    #    签到机制确保资源分配给真正需要的用户，感谢你的理解与配合
    #    GitHub Actions is a shared public resource provided by the platform
    #    Check-in ensures resources go to those who truly need it — thank you
    #
    # 🚀 长期使用请部署 Docker 版本 / For long-term use, deploy Docker version
    #
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    #
    # UTC → 北京时间：08:00–21:30 每半小时，另加 22:00 最后一趟。
    # */30 0-14 会额外触发 22:30。Actions 可能延迟，以实际执行时间匹配 timeline。
    - cron: "*/30 0-13 * * *"
    - cron: "0 14 * * *"

  workflow_dispatch:
    inputs:
      test_notification:
        description: "仅发送 Bark 测试通知（需先添加 BARK_URL）"
        type: boolean
        required: false
        default: false

concurrency:
  group: crawler-${{ github.ref_name }}
  cancel-in-progress: false  # 串行完成抓取和状态保存，避免取消导致去重记录丢失

permissions:
  contents: read
  actions: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          clean: true

      - name: Check Expiration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WORKFLOW_FILE="crawler.yml"
          API_URL="repos/${{ github.repository }}/actions/workflows/$WORKFLOW_FILE/runs"

          TOTAL=$(gh api "$API_URL" --jq '.total_count')
          if [ -z "$TOTAL" ] || [ "$TOTAL" -eq 0 ]; then
            echo "No previous runs found, skipping expiration check"
            exit 0
          fi

          LAST_PAGE=$(( (TOTAL + 99) / 100 ))
          FIRST_RUN_DATE=$(gh api "$API_URL?per_page=100&page=$LAST_PAGE" --jq '.workflow_runs[-1].created_at')

          if [ -n "$FIRST_RUN_DATE" ]; then
            CURRENT_TIMESTAMP=$(date +%s)
            FIRST_RUN_TIMESTAMP=$(date -d "$FIRST_RUN_DATE" +%s)
            DIFF_SECONDS=$((CURRENT_TIMESTAMP - FIRST_RUN_TIMESTAMP))
            LIMIT_SECONDS=604800

            if [ $DIFF_SECONDS -gt $LIMIT_SECONDS ]; then
              echo "⚠️ 试用期已结束，请运行 'Check In' 签到续期"
              echo "⚠️ Trial expired. Run 'Check In' to renew."
              gh workflow disable "$WORKFLOW_FILE"
              exit 1
            else
              DAYS_LEFT=$(( (LIMIT_SECONDS - DIFF_SECONDS) / 86400 ))
              echo "✅ 试用期剩余 ${DAYS_LEFT} 天，到期前请运行 'Check In' 签到续期"
              echo "✅ Trial: ${DAYS_LEFT} days left. Run 'Check In' before expiry to renew."
            fi
          fi


      # --------------------------------------------------------------------------------
      # 🚦 TRAFFIC CONTROL / 流量控制
      # --------------------------------------------------------------------------------
      # EN: Generates a random delay between 1 and 300 seconds (5 minutes).
      #     Critical for load balancing.
      #
      # CN: 生成 1 到 300 秒（5分钟）之间的随机延迟。
      #     这对负载均衡至关重要。
      # - name: Random Delay (Traffic Control)
      #   if: success()
      #   run: |
      #     echo "🎲 Traffic Control: Generating random delay..."
      #     DELAY=$(( ( RANDOM % 300 )  + 1 ))
      #     echo "⏸️  Sleeping for ${DELAY} seconds to spread the load..."
      #     sleep ${DELAY}s
      #     echo "▶️  Delay finished. Starting crawler..."

      - name: Set up Python
        if: success()
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        if: success()
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        if: success()
        run: uv sync --frozen --no-dev

      - name: Verify required files
        if: success()
        run: |
          if [ ! -f config/config.yaml ]; then
            echo "Error: Config missing"
            exit 1
          fi

      # GitHub runner 每次都是全新环境：恢复当日 SQLite 才能跨次增量/晚间只推一次。
      # 仅缓存运行状态，不缓存配置或密钥；不同日期使用不同前缀。
      - name: Prepare state cache key
        if: success()
        id: state_key
        run: echo "day=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore daily crawler state
        if: success()
        uses: actions/cache/restore@v6
        with:
          path: output/runtime/news
          key: trendradar-state-v1-${{ github.ref_name }}-${{ steps.state_key.outputs.day }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            trendradar-state-v1-${{ github.ref_name }}-${{ steps.state_key.outputs.day }}-

      - name: Run crawler
        if: success()
        id: crawler
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          WEWORK_WEBHOOK_URL: ""  # 已切换 Bark，避免旧企业微信 Secret 造成双重推送
          WEWORK_MSG_TYPE: "markdown"
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER_URL: ${{ secrets.NTFY_SERVER_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          BARK_URL: ${{ secrets.BARK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # 通用Webhook配置
          GENERIC_WEBHOOK_URL: ${{ secrets.GENERIC_WEBHOOK_URL }}
          GENERIC_WEBHOOK_TEMPLATE: ${{ secrets.GENERIC_WEBHOOK_TEMPLATE }}
          # AI 配置（ai_analysis 和 ai_translation 共享模型配置）
          AI_ANALYSIS_ENABLED: "false"  # 第一版固定关闭；以后开启需同时调整此处和 timeline
          AI_TRANSLATION_ENABLED: "false"
          AI_FILTER_ENABLED: "false"
          LITELLM_LOCAL_MODEL_COST_MAP: "true"  # AI 关闭时使用库内置价格表，避免无关联网超时
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_API_BASE: ${{ secrets.AI_API_BASE }}
          # 远程存储配置
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_REGION: ${{ secrets.S3_REGION }}
          GITHUB_ACTIONS: true
        run: |
          # 不打印设备密钥；避免把首页占位示例或不完整地址当作有效配置。
          uv run python - <<'PY'
          import os
          from urllib.parse import urlsplit
          value = os.environ.get("BARK_URL", "").strip()
          if value:
              urls = value.split(";")
              for url in urls:
                  parsed = urlsplit(url.strip())
                  key = parsed.path.strip("/")
                  if (parsed.scheme != "https" or not parsed.netloc or parsed.username
                      or parsed.password or not key or "/" in key or parsed.query or parsed.fragment
                      or key.strip("<>").lower() in {"your_key", "yourkey", "your_device_key", "真实设备key", "设备key"}):
                      raise SystemExit("BARK_URL 格式无效：请填写 https://服务器地址/真实设备Key，不要填 curl 命令、YOUR_KEY、标题或正文。")
          PY
          uv run python -m trendradar --doctor
          if [ "${{ inputs.test_notification }}" = "true" ]; then
            if [ -z "$BARK_URL" ]; then
              echo "::error::尚未配置 BARK_URL；请在 Bark 开启通知并取得真实推送地址，再添加仓库 Secret。"
              echo "Bark 测试未执行：缺少 BARK_URL。" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            uv run python -m trendradar --test-notification
            echo "通知测试接口已返回成功；请确认日志中 Bark 测试成功，并在 iPhone 确认收到测试消息。" >> "$GITHUB_STEP_SUMMARY"
          else
            if [ -z "$BARK_URL" ]; then
              echo "::warning::尚未配置 BARK_URL，本次只验收抓取和筛选，未验收 Bark 送达。"
              echo "Bark 未配置：本次只运行抓取和筛选。" >> "$GITHUB_STEP_SUMMARY"
            fi
            export CRAWL_STARTED_AT="$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
            uv run python -m trendradar
            # 官方入口会捕获部分异常；核对本次数据库记录，避免把旧缓存当成抓取成功。
            uv run python - <<'PY'
          import os, sqlite3
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          day = datetime.now(ZoneInfo("Asia/Shanghai")).strftime("%Y-%m-%d")
          db = Path("output/runtime/news") / f"{day}.db"
          if not db.exists():
              raise SystemExit("本次没有生成新闻数据库，请查看前面的抓取日志。")
          with sqlite3.connect(db) as conn:
              record = conn.execute("SELECT id, total_items, created_at FROM crawl_records ORDER BY id DESC LIMIT 1").fetchone()
              if not record or record[2] < os.environ["CRAWL_STARTED_AT"]:
                  raise SystemExit("本次没有保存新的抓取记录，请查看前面的错误日志。")
              states = conn.execute("SELECT platform_id, status FROM crawl_source_status WHERE crawl_record_id=?", (record[0],)).fetchall()
          success = [p for p, status in states if status == "success"]
          failed = [p for p, status in states if status == "failed"]
          summary = f"本次抓取 {record[1]} 条；成功平台：{', '.join(success) or '无'}；失败平台：{', '.join(failed) or '无'}。"
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(summary + "\n")
          if not success or record[1] <= 0:
              raise SystemExit("所有平台抓取失败或没有数据。")
          if failed:
              print("::warning::部分平台抓取失败，请查看运行摘要。")
          PY
          fi

      - name: Save daily crawler state
        if: ${{ always() && steps.crawler.outcome != 'skipped' && steps.state_key.outputs.day != '' }}
        uses: actions/cache/save@v6
        with:
          path: output/runtime/news
          key: trendradar-state-v1-${{ github.ref_name }}-${{ steps.state_key.outputs.day }}-${{ github.run_id }}-${{ github.run_attempt }}

      # 首次验收和排查抓取异常时可下载；Check In 会删除工作流历史及其附件。
      - name: Upload crawler report
        if: ${{ always() && steps.crawler.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: trendradar-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/html/
            output/meta/doctor_report.json
          if-no-files-found: ignore
          retention-days: 7

      # --------------------------------------------------------------------------------
      # ☁️ CLOUDFLARE PAGES DEPLOY / 部署到 Cloudflare Pages（可选）
      # --------------------------------------------------------------------------------
      # 将爬虫生成的 index.html 自动部署到 Cloudflare Pages，国内访问比 GitHub Pages 更快。
      # 仅当下面三个 Secrets 均已配置时才会执行，缺任意一个则自动跳过，不影响其它流程：
      #   - CLOUDFLARE_API_TOKEN     权限：Account → Cloudflare Pages → Edit
      #   - CLOUDFLARE_ACCOUNT_ID    Cloudflare 账户 ID
      #   - CLOUDFLARE_PROJECT_NAME  Cloudflare Pages 项目名（需提前在 Dashboard 创建）
      # 配置教程详见 README「自动部署到 Cloudflare Pages」章节。
      # --------------------------------------------------------------------------------
      - name: Check Cloudflare config
        if: success()
        id: cf_check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CLOUDFLARE_PROJECT_NAME" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "✅ 检测到 Cloudflare 配置，准备部署到 Cloudflare Pages"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ 未配置 Cloudflare Secrets，跳过 Cloudflare Pages 部署"
          fi

      - name: Prepare Cloudflare Pages assets
        if: success() && steps.cf_check.outputs.enabled == 'true'
        run: |
          if [ ! -f index.html ]; then
            echo "❌ 未找到 index.html，请确认爬虫已生成网页报告"
            exit 1
          fi
          rm -rf cloudflare_dist
          mkdir -p cloudflare_dist
          cp index.html cloudflare_dist/index.html

      - name: Deploy to Cloudflare Pages
        if: success() && steps.cf_check.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy cloudflare_dist --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }}
